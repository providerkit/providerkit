name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core/**"
      - "brand/**"
      - "package.json"
      - "bun.lock"

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Builds core first — the site imports it through its exports map.
      - name: Build
        run: bun run build:site

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Deploy via Bun — `wrangler pages deploy` only uploads the built dir, so it
        # sidesteps the npm/workspace-manifest issue. `--branch=main` forces a
        # production deploy (CI checkout is detached, so wrangler can't infer it).
        run: bunx wrangler@latest pages deploy site/dist --project-name=providerkit --branch=main
